<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>家計簿</title>
<style>
:root{
  --bg:#F3F4F2;
  --card:#FFFFFF;
  --ink:#1A1C1B;
  --ink-soft:#5B635F;
  --ink-faint:#8B9490;
  --line:#DFE3E0;
  --accent:#2E6B55;
  --accent-soft:#E3EDE8;
  --warn:#A8452F;
  --sat-low:#C0705E;
  --sat-mid:#9A8A52;
  --sat-high:#3F7E63;
  --fixed:#7A8A96;
  --fixed-soft:#E4E9EC;
  --income:#3A6B8A;
  --warn-soft:#F6E7E3;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#151817;
    --card:#1E2321;
    --ink:#E6EAE8;
    --ink-soft:#A3ADA8;
    --ink-faint:#78827E;
    --line:#2C3330;
    --accent:#6FBF9B;
    --accent-soft:#1D2B25;
    --warn:#E08F7C;
    --sat-low:#DB8B79;
    --sat-mid:#CBB877;
    --sat-high:#6FBF9B;
    --fixed:#8A99A4;
    --fixed-soft:#222A2E;
    --income:#7FB0CE;
    --warn-soft:#2E211E;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  font-size:15px; line-height:1.6;
  padding-top:env(safe-area-inset-top,0px);
}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:600px;margin:0 auto;padding:0 14px 96px}

header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:16px 0 10px}
h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.02em}
.hsum{font-size:12px;color:var(--ink-soft)}
.hsum b{font-size:18px;color:var(--ink);font-variant-numeric:tabular-nums;margin-left:5px}

nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  display:grid;grid-template-columns:repeat(3,1fr);
  background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
nav.tabs button{
  appearance:none;border:0;background:transparent;color:var(--ink-faint);
  padding:11px 4px 12px;font-size:12px;cursor:pointer;font-family:inherit;font-weight:700;
  border-top:2px solid transparent;margin-top:-1px;
}
nav.tabs button[aria-selected="true"]{color:var(--accent);border-top-color:var(--accent)}

.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.card h2{font-size:13px;margin:0 0 10px;font-weight:700;letter-spacing:.04em;color:var(--ink-soft)}
.lbl{display:block;font-size:11px;letter-spacing:.08em;color:var(--ink-faint);margin-bottom:6px;font-weight:700}

.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
.seg button{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);
  border-radius:7px;padding:8px;font-size:13px;cursor:pointer;font-family:inherit}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:700}
#amount{width:100%;font-size:32px;font-weight:700;font-variant-numeric:tabular-nums;
  padding:8px 10px;border:1px solid var(--line);border-radius:8px;
  background:var(--bg);color:var(--ink);text-align:right}
#amount:focus{outline:2px solid var(--accent);outline-offset:1px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:6px}
.chip{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);
  border-radius:7px;padding:9px 4px;font-size:12.5px;cursor:pointer;font-family:inherit;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.chip.fx{color:var(--fixed)}
.chip.fx[aria-pressed="true"]{background:var(--fixed);border-color:var(--fixed);color:#fff}
.sat{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sat button{appearance:none;border:1px solid var(--line);background:var(--card);
  border-radius:7px;padding:10px 4px;font-size:13px;cursor:pointer;font-family:inherit;color:var(--ink-soft)}
.sat button[aria-pressed="true"]{color:#fff;font-weight:700}
.sat button[data-v="1"][aria-pressed="true"]{background:var(--sat-low);border-color:var(--sat-low)}
.sat button[data-v="2"][aria-pressed="true"]{background:var(--sat-mid);border-color:var(--sat-mid)}
.sat button[data-v="3"][aria-pressed="true"]{background:var(--sat-high);border-color:var(--sat-high)}
.row2{display:grid;grid-template-columns:1fr 132px;gap:8px}
input[type="text"],input[type="date"]{width:100%;padding:9px 10px;border:1px solid var(--line);
  border-radius:7px;background:var(--bg);color:var(--ink);font-size:14px;font-family:inherit}
.field{margin-top:12px}
#save{width:100%;margin-top:14px;padding:14px;border:0;border-radius:8px;
  background:var(--accent);color:#fff;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}

.daygroup{margin-bottom:16px}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--ink-faint);
  padding:0 2px 5px;border-bottom:1px solid var(--line);margin-bottom:2px}
.dayhead b{color:var(--ink-soft);font-variant-numeric:tabular-nums}
.item{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;
  padding:10px 2px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.it-main{min-width:0}
.it-cat{font-size:14px}
.it-memo{font-size:12px;color:var(--ink-faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it-amt{font-variant-numeric:tabular-nums;font-size:15px;font-weight:700;white-space:nowrap}
.it-amt.inc{color:var(--income)}
.del{appearance:none;border:0;background:transparent;color:var(--ink-faint);
  font-size:17px;cursor:pointer;padding:2px 6px;line-height:1;font-family:inherit}
.del:hover{color:var(--warn)}

.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:14px}
.kpi{background:var(--card);padding:11px 8px;text-align:center}
.kpi .k{font-size:10.5px;color:var(--ink-faint);letter-spacing:.04em}
.kpi .v{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .v.inc{color:var(--income)}
.kpi .v.neg{color:var(--warn)}

.cmp{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.cmp:last-child{border-bottom:0}
.cmp .d{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.up{color:var(--warn)} .down{color:var(--accent)}

.bars{display:block;width:100%;height:auto}

.split{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.splitbox{border-radius:8px;padding:11px 12px}
.splitbox.v{background:var(--accent-soft)}
.splitbox.f{background:var(--fixed-soft)}
.splitbox .k{font-size:11px;color:var(--ink-soft);font-weight:700}
.splitbox .v2{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.splitbox .s{font-size:11px;color:var(--ink-faint);margin-top:1px}

.catrow{display:grid;grid-template-columns:1fr auto auto;gap:9px;align-items:center;
  padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.catrow:last-child{border-bottom:0}
.catrow .amt{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.catrow .dif{font-size:11.5px;font-variant-numeric:tabular-nums;white-space:nowrap;min-width:62px;text-align:right}
.satbar{display:flex;height:9px;border-radius:5px;overflow:hidden;margin:9px 0 7px;background:var(--line)}
.satbar i{display:block;height:100%}
.satlegend{display:flex;gap:13px;font-size:11.5px;color:var(--ink-soft);flex-wrap:wrap}
.satlegend span{display:flex;align-items:center;gap:5px}
.sq{width:9px;height:9px;border-radius:2px;display:inline-block}

.mlist{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.mlist button{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);
  border-radius:20px;padding:5px 13px;font-size:12px;cursor:pointer;font-family:inherit;white-space:nowrap;
  font-variant-numeric:tabular-nums}
.mlist button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:700}

.impbtn{display:inline-block;border:1px solid var(--accent);color:var(--accent);background:transparent;
  border-radius:7px;padding:8px 14px;font-size:13px;cursor:pointer;font-family:inherit;font-weight:700}
.impbtn:hover{background:var(--accent-soft)}
.impbtn.danger{border-color:var(--warn);color:var(--warn)}
.impbtn.danger:hover{background:var(--warn);color:#fff}
.imp{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hint{font-size:11.5px;color:var(--ink-faint);margin:8px 0 0;line-height:1.8}
.impresult{font-size:12.5px;color:var(--ink-soft);margin:10px 0 0;padding:10px;
  background:var(--accent-soft);border-radius:7px;line-height:1.8;display:none}
.impresult.on{display:block}

.ratio{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.ratio b{font-size:38px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;color:var(--accent)}
.ratio span{font-size:12px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.ratio.warn b{color:var(--sat-mid)}
.ratio.over b{color:var(--warn)}
.gauge{height:8px;border-radius:4px;background:var(--line);margin-top:11px;overflow:hidden}
.gauge i{display:block;height:100%;background:var(--accent);border-radius:4px}
.gauge i.warn{background:var(--sat-mid)}
.gauge i.over{background:var(--warn)}

.fund{background:var(--accent-soft);border-radius:8px;padding:12px;margin-bottom:10px}
.fund .k{font-size:11px;color:var(--ink-soft);font-weight:700}
.fund .v2{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px;color:var(--accent)}
.fund .s{font-size:11.5px;color:var(--ink-faint);margin-top:3px}

.cardform{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.cardrow{display:grid;grid-template-columns:1fr auto 24px;gap:8px;align-items:center;font-size:13px}
.cardrow input{width:120px;padding:7px 9px;border:1px solid var(--line);border-radius:7px;
  background:var(--bg);color:var(--ink);font-size:14px;text-align:right;font-variant-numeric:tabular-nums}
.cardrow .unit{font-size:11.5px;color:var(--ink-faint)}
.splitbox.w{background:var(--warn-soft)}
.warnline{font-size:12.5px;color:var(--warn);margin:10px 0 0;line-height:1.9;
  background:var(--warn-soft);border-radius:7px;padding:10px}

.idealrow{display:grid;grid-template-columns:72px 1fr 40px 54px;gap:8px;align-items:center;
  padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.idealrow:last-of-type{border-bottom:0}
.idealrow .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibar{position:relative;height:9px;background:var(--line);border-radius:5px;overflow:hidden}
.ibar .fl{position:absolute;left:0;top:0;height:100%;background:var(--accent);border-radius:5px}
.ibar .fl.over{background:var(--warn)}
.ibar .mk{position:absolute;top:-2px;width:2px;height:13px;background:var(--ink-soft);border-radius:1px}
.idealrow .pc{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.idealrow .pc.over{color:var(--warn)}
.idealrow .id{text-align:right;font-size:11px;color:var(--ink-faint);white-space:nowrap}

.empty{text-align:center;color:var(--ink-faint);font-size:13.5px;padding:26px 10px;line-height:2;white-space:pre-line}
.foot{font-size:11.5px;color:var(--ink-faint);text-align:center;padding:8px 0 0;line-height:1.9}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom,0px));
  background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:20px;font-size:13px;
  opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;max-width:88%;text-align:center}
.toast.on{opacity:.95}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>家計簿</h1>
  <div class="hsum">今月の支出 <b id="mtotal" class="num">¥0</b></div>
</header>

<section id="pane-input">
  <div class="card">
    <div class="seg" id="kind">
      <button type="button" data-k="out" aria-pressed="true">支出</button>
      <button type="button" data-k="in" aria-pressed="false">収入</button>
    </div>

    <label class="lbl" for="amount">金額</label>
    <input id="amount" type="number" inputmode="numeric" placeholder="0" min="0" step="1">

    <div class="field">
      <span class="lbl">カテゴリ</span>
      <div class="grid" id="cats"></div>
    </div>

    <div class="field" id="satfield">
      <span class="lbl">満足度</span>
      <div class="sat" id="sats">
        <button type="button" data-v="1" aria-pressed="false">いまいち</button>
        <button type="button" data-v="2" aria-pressed="false">ふつう</button>
        <button type="button" data-v="3" aria-pressed="false">よかった</button>
      </div>
    </div>

    <div class="field row2">
      <input id="memo" type="text" placeholder="メモ（店名など）" maxlength="40">
      <input id="date" type="date">
    </div>

    <button id="save">保存</button>
  </div>
</section>

<section id="pane-log" hidden>
  <div class="card">
    <h2>データの出し入れ</h2>
    <div class="imp">
      <label class="impbtn" for="csvfile">CSVを取り込む</label>
      <input type="file" id="csvfile" accept=".csv,text/csv" style="display:none">
      <button class="impbtn" id="csvout" type="button">CSVに書き出す</button>
      <button class="impbtn danger" id="wipe" type="button">全部消す</button>
    </div>
    <p class="hint">
      取り込み：いま使っている家計簿アプリから出したCSV。<strong>支出だけ</strong>入ります。<br>
      書き出し：満足度を含めた全件。<strong>マネーフォワードはこれを有料にしています。</strong>
    </p>
    <p class="impresult" id="impresult"></p>
  </div>
  <div id="list"></div>
</section>

<section id="pane-report" hidden>
  <div class="mlist" id="months"></div>
  <div id="report"></div>
</section>

<p class="foot">
  データはこの端末の中だけに保存されます。外には送られません。
</p>

</div>

<nav class="tabs" role="tablist">
  <button type="button" data-p="input"  aria-selected="true">入力</button>
  <button type="button" data-p="log"    aria-selected="false">記録</button>
  <button type="button" data-p="report" aria-selected="false">レポート</button>
</nav>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";
  var KEY = "kakeibo_entries_v1";

  var CATS_OUT = [
    {n:"食費"}, {n:"外食費"}, {n:"日用品"}, {n:"交通費"},
    {n:"趣味"}, {n:"交際費"}, {n:"衣服"},  {n:"書籍/資格"},
    {n:"医療費"}, {n:"車関係"},
    {n:"家賃",f:1}, {n:"光熱費",f:1}, {n:"通信費",f:1}, {n:"サブスク",f:1},
    {n:"投資",f:1}, {n:"クレジットカード",f:1}, {n:"その他"}
  ];
  var CATS_IN = [{n:"給与"},{n:"賞与"},{n:"副収入"},{n:"立替の返金"},{n:"その他の収入"}];

  var FIXED = {};
  CATS_OUT.forEach(function(c){ if (c.f) FIXED[c.n] = 1; });

  // 手取りに対する理想の割合（％）。合計78％で、残り22％が貯蓄にまわる想定
  var IDEAL = {
    "家賃":25, "車関係":15, "食費":12, "光熱費":5, "通信費":5,
    "外食費":3, "日用品":3, "交通費":3, "趣味":3, "衣服":3,
    "交際費":2, "書籍/資格":2, "医療費":1, "サブスク":1
  };
  var CARDKEY = "kakeibo_card_v1";

  var SATCOLOR = {1:"var(--sat-low)", 2:"var(--sat-mid)", 3:"var(--sat-high)"};
  var SATNAME  = {1:"いまいち", 2:"ふつう", 3:"よかった"};

  var kind = "out", pickedCat = null, pickedSat = null, viewMonth = null;

  function load(){
    try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch(e){ return []; }
  }
  function store(list){
    try { localStorage.setItem(KEY, JSON.stringify(list)); return true; }
    catch(e){ toast("保存できませんでした"); return false; }
  }
  function yen(n){ return "¥" + Math.round(Number(n)).toLocaleString("ja-JP"); }
  function signed(n){
    var s = n > 0 ? "+" : n < 0 ? "−" : "±";
    return s + Math.abs(Math.round(n)).toLocaleString("ja-JP");
  }
  function pad(x){ return String(x).length < 2 ? "0" + x : String(x); }
  function today(){ var d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
  function addMonth(ym, delta){
    var y = Number(ym.slice(0,4)), m = Number(ym.slice(5,7)) + delta;
    y += Math.floor((m - 1) / 12);
    m = ((m - 1) % 12 + 12) % 12 + 1;
    return y + "-" + pad(m);
  }
  function el(tag, cls, text){
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== null) e.textContent = text;
    return e;
  }
  var TO;
  function toast(msg){
    var t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("on");
    clearTimeout(TO); TO = setTimeout(function(){ t.classList.remove("on"); }, 2200);
  }
  function isOut(e){ return e.kind !== "in"; }

  var panes = {
    input:  document.getElementById("pane-input"),
    log:    document.getElementById("pane-log"),
    report: document.getElementById("pane-report")
  };
  Array.prototype.forEach.call(document.querySelectorAll("nav.tabs button"), function(b){
    b.addEventListener("click", function(){
      Array.prototype.forEach.call(document.querySelectorAll("nav.tabs button"), function(x){
        x.setAttribute("aria-selected", x === b ? "true" : "false");
      });
      Object.keys(panes).forEach(function(k){ panes[k].hidden = (k !== b.dataset.p); });
      if (b.dataset.p === "report") renderReport();
      if (b.dataset.p === "log") renderList();
      window.scrollTo(0, 0);
    });
  });

  var catBox = document.getElementById("cats");
  var satBox = document.getElementById("sats");
  var satField = document.getElementById("satfield");
  var amountEl = document.getElementById("amount");
  var memoEl = document.getElementById("memo");
  var dateEl = document.getElementById("date");
  dateEl.value = today();

  function buildCats(){
    catBox.textContent = "";
    pickedCat = null;
    (kind === "out" ? CATS_OUT : CATS_IN).forEach(function(c){
      var b = el("button", "chip" + (c.f ? " fx" : ""), c.n);
      b.type = "button";
      b.setAttribute("aria-pressed", "false");
      b.addEventListener("click", function(){
        Array.prototype.forEach.call(catBox.children, function(x){ x.setAttribute("aria-pressed","false"); });
        b.setAttribute("aria-pressed","true");
        pickedCat = c.n;
      });
      catBox.appendChild(b);
    });
  }
  buildCats();

  Array.prototype.forEach.call(document.getElementById("kind").children, function(b){
    b.addEventListener("click", function(){
      kind = b.dataset.k;
      Array.prototype.forEach.call(document.getElementById("kind").children, function(x){
        x.setAttribute("aria-pressed", x === b ? "true" : "false");
      });
      satField.hidden = (kind === "in");
      buildCats();
    });
  });

  Array.prototype.forEach.call(satBox.children, function(b){
    b.addEventListener("click", function(){
      Array.prototype.forEach.call(satBox.children, function(x){ x.setAttribute("aria-pressed","false"); });
      b.setAttribute("aria-pressed","true");
      pickedSat = Number(b.dataset.v);
    });
  });

  document.getElementById("save").addEventListener("click", function(){
    var lack = [];
    if (!(Number(amountEl.value) > 0)) lack.push("金額");
    if (!pickedCat) lack.push("カテゴリ");
    if (kind === "out" && !pickedSat) lack.push("満足度");
    if (lack.length){ toast(lack.join("と") + "を入れてください"); return; }

    var amt = Math.round(Number(amountEl.value));
    var list = load();
    list.push({
      id: Date.now() + "-" + Math.random().toString(36).slice(2,7),
      amount: amt, category: pickedCat, memo: memoEl.value.trim(),
      date: dateEl.value || today(),
      sat: kind === "out" ? pickedSat : null,
      kind: kind, createdAt: new Date().toISOString()
    });
    if (!store(list)) return;

    amountEl.value = ""; memoEl.value = "";
    pickedCat = null; pickedSat = null;

    Array.prototype.forEach.call(satBox.children, function(x){ x.setAttribute("aria-pressed","false"); });

  function decodeAuto(buf){
    var u = new TextDecoder("utf-8").decode(buf), sj = u;
    try { sj = new TextDecoder("shift_jis").decode(buf); } catch(e){ return u; }
    var bad = String.fromCharCode(0xFFFD);
    var cu = u.split(bad).length - 1;
    var cs = sj.split(bad).length - 1;
    return cs < cu ? sj : u;
  }
  function splitCsvLine(line){
    var out = [], cur = "", q = false;
    for (var i = 0; i < line.length; i++){
      var ch = line.charAt(i);
      if (q){
        if (ch === '"'){ if (line.charAt(i+1) === '"'){ cur += '"'; i++; } else { q = false; } }
        else cur += ch;
      } else {
        if (ch === '"') q = true;
        else if (ch === ","){ out.push(cur); cur = ""; }
        else cur += ch;
      }
    }
    out.push(cur);
    return out;
  }
  function showImport(msg){
    var e = document.getElementById("impresult");
    e.textContent = msg; e.classList.add("on");
  }
  // 数字だけ拾う（"−1,450" や "¥1,450" にも耐える）
  function toNum(s){
    var t = "", i, ch;
    for (i = 0; i < s.length; i++){
      ch = s.charAt(i);
      if ((ch >= "0" && ch <= "9") || ch === ".") t += ch;
      else if (ch === "-" || ch === "−" || ch === "－") t += "-";
    }
    return t === "" || t === "-" ? NaN : Number(t);
  }
  // 2026/9/1 も 2026-09-01 も受ける
  function normDate(s){
    var t = s.split("/").join("-").split(".").join("-").split("年").join("-").split("月").join("-").split("日").join("");
    var p = t.split("-");
    if (p.length < 3 || p[0].length !== 4) return "";
    var y = Number(p[0]), m = Number(p[1]), d = Number(p[2]);
    if (!y || !m || !d || m > 12 || d > 31) return "";
    return p[0] + "-" + pad(m) + "-" + pad(d);
  }

  function importCsv(text){
    var lines = text.split(/\r\n|\r|\n/).filter(function(x){ return x.trim(); });
    if (!lines.length){ showImport("ファイルが空でした。"); return; }
    var bom = String.fromCharCode(0xFEFF);
    var head = splitCsvLine(lines.shift()).map(function(h){
      return h.split(bom).join("").split('"').join("").trim();
    });

    // 列の名前はアプリによって違うので、候補を順に探す
    function findCol(names){
      var i, j;
      for (i = 0; i < names.length; i++){
        j = head.indexOf(names[i]);
        if (j >= 0) return j;
      }
      for (j = 0; j < head.length; j++){
        for (i = 0; i < names.length; i++){
          if (head[j].indexOf(names[i]) >= 0) return j;
        }
      }
      return -1;
    }

    var iA = findCol(["金額（円）", "金額(円)", "金額", "出金金額", "支払金額"]);
    var iD = findCol(["日付", "取引日", "利用日"]);
    var iC = findCol(["大項目", "カテゴリー名", "カテゴリ", "費目"]);
    var iM = findCol(["内容", "メモ", "摘要", "お店"]);
    var iSub = findCol(["中項目"]);
    var iCalc = findCol(["計算対象"]);
    var iTr = findCol(["振替"]);

    if (iA < 0 || iD < 0){
      showImport("見出しが読めませんでした。「金額」と「日付」にあたる列が必要です。（読み取った見出し：" + head.join(" / ") + "）");
      return;
    }
    var isMF = (iCalc >= 0 || iTr >= 0);

    var list = load(), seen = {};
    list.forEach(function(e){
      var base = e.date + "|" + e.amount + "|" + e.category + "|" + e.memo;
      seen[(isOut(e) ? "out|" : "in|") + base] = 1;
      seen[base] = 1; // 旧い形式のキー（支出のみだった頃の取り込み分）
    });

    var added = 0, income = 0, dup = 0, bad = 0, excluded = 0, transfer = 0;

    lines.forEach(function(l){
      var c = splitCsvLine(l);
      function cell(i){
        if (i < 0 || c[i] === undefined || c[i] === null) return "";
        return String(c[i]).split('"').join("").trim();
      }

      // マネーフォワード：計算対象でない行と、口座間の振替は支出ではない
      if (iCalc >= 0 && cell(iCalc) === "0"){ excluded++; return; }
      if (iTr >= 0 && cell(iTr) === "1"){ transfer++; return; }

      var amt = toNum(cell(iA));
      var date = normDate(cell(iD));
      if (!amt || !date){ bad++; return; }

      var isIncome = (amt > 0);

      var memo = cell(iM);
      var sub = cell(iSub);
      if (sub && sub !== "未分類" && memo.indexOf(sub) < 0) memo = memo ? (memo + "／" + sub) : sub;

      var cat = cell(iC) || (isIncome ? "その他の収入" : "その他");
      if (cat === "未分類") cat = isIncome ? "その他の収入" : "その他";
      if (isIncome && cat === "収入") cat = "その他の収入";

      var amount = Math.abs(Math.round(amt));
      var base = date + "|" + amount + "|" + cat + "|" + memo;
      var key = (isIncome ? "in|" : "out|") + base;
      if (seen[key] || (!isIncome && seen[base])){ dup++; return; }
      seen[key] = 1;
      if (!isIncome) seen[base] = 1;
      list.push({
        id: "csv-" + date + "-" + amount + "-" + Math.random().toString(36).slice(2,7),
        amount: amount, category: cat, memo: memo, date: date,
        sat: null, kind: isIncome ? "in" : "out",
        createdAt: new Date().toISOString(), src: "csv"
      });
      if (isIncome) income++; else added++;
    });

    if (!store(list)) return;
    refreshHeader(); renderList();

    var msg = (isMF ? "マネーフォワード形式として読みました。" : "")
            + "支出 " + added + "件、収入 " + income + "件を取り込みました。";
    var skip = [];
    if (transfer) skip.push("口座間の振替 " + transfer + "件");
    if (excluded) skip.push("計算対象外 " + excluded + "件");
    if (dup) skip.push("重複 " + dup + "件");
    if (bad) skip.push("読めない行 " + bad + "件");
    if (skip.length) msg += "（飛ばしたもの：" + skip.join(" / ") + "）";
    msg += " 取り込んだ分に満足度は入っていません。";
    showImport(msg);
    toast(added + "件を取り込みました");
  }

  function monthsOf(list){
    var s = {};
    list.forEach(function(e){ s[e.date.slice(0,7)] = 1; });
    return Object.keys(s).sort();
  }
  function sumBy(list, ym){
    var o = 0, i = 0, cats = {}, sat = {1:0,2:0,3:0,none:0}, vari = 0, fix = 0;
    list.forEach(function(e){
      if (e.date.slice(0,7) !== ym) return;
      if (!isOut(e)){ i += e.amount; return; }
      o += e.amount;
      cats[e.category] = (cats[e.category] || 0) + e.amount;
      if (FIXED[e.category]) fix += e.amount; else vari += e.amount;
      if (e.sat) sat[e.sat] += e.amount; else sat.none += e.amount;
    });
    return {out:o, inc:i, cats:cats, sat:sat, vari:vari, fix:fix};
  }

  // 毎月は出ない大きな支出（特別費）を拾って、月あたりいくら積み立てればよいかを出す
  function specialFund(list){
    var ms = monthsOf(list);
    var n = ms.length || 1;
    var seen = {};
    list.forEach(function(e){
      if (!isOut(e)) return;
      if (!seen[e.category]) seen[e.category] = {};
      seen[e.category][e.date.slice(0,7)] = 1;
    });
    var items = [], total = 0;
    list.forEach(function(e){
      if (!isOut(e) || FIXED[e.category]) return;
      if (e.amount < 5000) return;
      var appear = Object.keys(seen[e.category] || {}).length;
      if (appear / n >= 0.6) return;  // ほぼ毎月出ているものは特別費ではない
      total += e.amount;
      items.push(e);
    });
    items.sort(function(a,b){ return b.amount - a.amount; });
    return {total:total, months:n, monthly: n ? total / n : 0, items:items};
  }

  // 収支を積み上げた線。月ごとの数字では見えない「崖」を出す
  function cumChart(list){
    var ms = monthsOf(list);
    if (ms.length < 2) return null;

    var cum = 0, data = [];
    ms.forEach(function(m){
      var s = sumBy(list, m);
      cum += (s.inc - s.out);
      data.push({ m: m, v: cum });
    });

    var mx = 0, mn = 0, lowIdx = 0, i;
    for (i = 0; i < data.length; i++){
      if (data[i].v > mx) mx = data[i].v;
      if (data[i].v < mn) mn = data[i].v;
      if (data[i].v < data[lowIdx].v) lowIdx = i;
    }
    var range = (mx - mn) || 1;

    var W = 600, H = 200, padL = 8, padR = 8, padT = 16, padB = 34;
    var iw = W - padL - padR, ih = H - padT - padB;
    function X(k){ return padL + (data.length === 1 ? iw / 2 : iw * k / (data.length - 1)); }
    function Y(v){ return padT + ih * (mx - v) / range; }

    var ns = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(ns, "svg");
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    svg.setAttribute("class", "bars");
    svg.setAttribute("role", "img");
    svg.setAttribute("aria-label", "収支を積み上げた推移");

    var zy = Y(0);
    var zl = document.createElementNS(ns, "line");
    zl.setAttribute("x1", padL); zl.setAttribute("x2", W - padR);
    zl.setAttribute("y1", zy); zl.setAttribute("y2", zy);

    var line = "M " + X(0) + " " + Y(data[0].v);

    var area = document.createElementNS(ns, "path");

    area.setAttribute("fill", "var(--warn)");
    area.setAttribute("opacity", "0.13");
    svg.appendChild(area);

    var pl = document.createElementNS(ns, "path");
    pl.setAttribute("d", line);
    pl.setAttribute("fill", "none");
    pl.setAttribute("stroke", "var(--accent)");
    pl.setAttribute("stroke-width", "2");
    pl.setAttribute("stroke-linejoin", "round");
    svg.appendChild(pl);

    data.forEach(function(d, k){
      var big = (k === lowIdx || k === data.length - 1);
      var c = document.createElementNS(ns, "circle");
      c.setAttribute("cx", X(k)); c.setAttribute("cy", Y(d.v));
      c.setAttribute("r", big ? 4 : 2.5);

      svg.appendChild(c);

      if (k === 0 || k === lowIdx || k === data.length - 1){
        var lab = document.createElementNS(ns, "text");
        lab.setAttribute("x", X(k));
        lab.setAttribute("y", H - 18);
        lab.setAttribute("text-anchor", k === 0 ? "start" : (k === data.length - 1 ? "end" : "middle"));
        lab.setAttribute("font-size", "11");
        lab.setAttribute("fill", "var(--ink-faint)");
        lab.textContent = d.m.split("-").join("/");
        svg.appendChild(lab);

        var val = document.createElementNS(ns, "text");
        val.setAttribute("x", X(k));
        val.setAttribute("y", H - 4);
        val.setAttribute("text-anchor", k === 0 ? "start" : (k === data.length - 1 ? "end" : "middle"));
        val.setAttribute("font-size", "11");
        val.setAttribute("font-weight", "700");
        val.setAttribute("fill", d.v < 0 ? "var(--warn)" : "var(--accent)");
        val.textContent = signed(d.v);
        svg.appendChild(val);
      }
    });

    var wrap = el("div", "card");
    wrap.appendChild(el("h2", null, "積み上げた収支（全期間）"));
    wrap.appendChild(svg);

    var now = data[data.length - 1].v;
    var low = data[lowIdx];
    var p = el("p", "hint");
    p.textContent = "いまの積み上げは " + signed(now) + "円。いちばん落ちたのは " +
      low.m.split("-").join("/") + " の " + signed(low.v) + "円。" +
      "月ごとの数字だけ見ていると、この落ち方は見えません。";
    wrap.appendChild(p);
    return wrap;
  }

  function renderReport(){
    var list = load();
    var box = document.getElementById("report");
    var mbox = document.getElementById("months");
    box.textContent = ""; mbox.textContent = "";

    if (!list.length){
      box.appendChild(el("p","empty","まだデータがありません。\n「記録」からCSVを取り込むか、「入力」から入れてください。"));
      return;
    }

    var ms = monthsOf(list);
    if (!viewMonth || ms.indexOf(viewMonth) < 0) viewMonth = ms[ms.length - 1];

    ms.slice().reverse().forEach(function(m){
      var b = el("button", null, m.split("-").join("/"));
      b.type = "button";
      b.setAttribute("aria-pressed", m === viewMonth ? "true" : "false");
      b.addEventListener("click", function(){ viewMonth = m; renderReport(); });
      mbox.appendChild(b);
    });

    var cur  = sumBy(list, viewMonth);
    var prev = sumBy(list, addMonth(viewMonth, -1));
    var yoy  = sumBy(list, addMonth(viewMonth, -12));

    var kp = el("div","kpis");
    function kpi(k, v, cls){
      var d = el("div","kpi");
      d.appendChild(el("div","k",k));
      d.appendChild(el("div","v" + (cls ? " " + cls : ""), v));
      return d;
    }
    kp.appendChild(kpi("収入", yen(cur.inc), "inc"));
    kp.appendChild(kpi("支出", yen(cur.out)));
    kp.appendChild(kpi("収支", signed(cur.inc - cur.out), (cur.inc - cur.out) < 0 ? "neg" : ""));
    box.appendChild(kp);

    // 手取りに対して、いくら使ったか
    var rc = el("div","card");
    rc.appendChild(el("h2", null, "手取りのうち、いくら使ったか"));
    if (!cur.inc){
      rc.appendChild(el("p","empty","この月は収入の記録がありません。\n収入を入れると、使いすぎかどうかが1つの数字で見えます。"));
    } else {
      var pct = Math.round(cur.out / cur.inc * 100);
      var big = el("div","ratio" + (pct > 100 ? " over" : pct > 90 ? " warn" : ""));
      big.appendChild(el("b", null, pct + "%"));
      big.appendChild(el("span", null, yen(cur.out) + " ÷ " + yen(cur.inc)));
      rc.appendChild(big);
      var gauge = el("div","gauge");
      var fill = el("i");
      fill.style.width = Math.min(pct, 100) + "%";
      if (pct > 100) fill.className = "over"; else if (pct > 90) fill.className = "warn";
      gauge.appendChild(fill);
      rc.appendChild(gauge);
      rc.appendChild(el("p","hint",
        pct > 100 ? "100％を超えています。足りない分は貯金か、賞与か、借入で埋めています。"
        : pct > 90 ? "ほとんど使い切っています。貯まっていません。"
        : "残った " + (100 - pct) + "％ が手元に残る計算です。80％以下なら安全圏です。"));
    }
    box.appendChild(rc);

    // 毎月は出ない大きな支出を拾って、積立額を出す
    var sf = specialFund(list);
    var sfc = el("div","card");
    sfc.appendChild(el("h2", null, "毎月は出ないのに、必ず来るもの"));
    if (!sf.items.length){
      sfc.appendChild(el("p","empty","まだ見つかっていません。\nデータが増えると、年に数回だけ出る支出をここに集めます。"));
    } else {
      var sb = el("div","fund");
      sb.appendChild(el("div","k","月にこれだけ貯めておく"));
      sb.appendChild(el("div","v2", yen(sf.monthly)));
      sb.appendChild(el("div","s", sf.months + "ヶ月で " + yen(sf.total) + " 出ていました"));
      sfc.appendChild(sb);
      sf.items.slice(0,8).forEach(function(e){
        var row = el("div","catrow");
        row.appendChild(el("span", null, e.category + (e.memo ? "　" + e.memo : "")));
        row.appendChild(el("span","amt", yen(e.amount)));
        row.appendChild(el("span","dif", e.date.slice(2).split("-").join("/")));
        sfc.appendChild(row);
      });
      if (sf.items.length > 8){
        sfc.appendChild(el("p","hint","ほかに " + (sf.items.length - 8) + " 件あります。"));
      }
      sfc.appendChild(el("p","hint","5,000円以上で、ほとんどの月には出ていない支出だけを集めています。これを月割りにして先に取り分けておくと、来た月に慌てません。"));
    }
    box.appendChild(sfc);

    // カードの未払い残高（自分で入れた数字）
    box.appendChild(cardCard());

    var cc0 = cumChart(list);
    if (cc0) box.appendChild(cc0);

    var cmpCard = el("div","card");
    cmpCard.appendChild(el("h2", null, "過去と比べる"));
    function cmpRow(label, now, before){
      var r = el("div","cmp");
      r.appendChild(el("span", null, label));
      if (!before){
        r.appendChild(el("span","d","比べる月のデータなし"));
      } else {
        var diff = now - before;
        r.appendChild(el("span","d " + (diff > 0 ? "up" : diff < 0 ? "down" : ""), signed(diff) + "円"));
      }
      return r;
    }
    cmpCard.appendChild(cmpRow("前の月の支出と比べて", cur.out, prev.out));
    cmpCard.appendChild(cmpRow("1年前の同じ月と比べて", cur.out, yoy.out));
    box.appendChild(cmpCard);

    var sp = el("div","card");
    sp.appendChild(el("h2", null, "動かせるお金と、動かせないお金"));
    var split = el("div","split");
    function sbox(cls, k, v, s){
      var d = el("div","splitbox " + cls);
      d.appendChild(el("div","k",k));
      d.appendChild(el("div","v2",v));
      d.appendChild(el("div","s",s));
      return d;
    }
    var tot = cur.vari + cur.fix;
    split.appendChild(sbox("v","動かせる", yen(cur.vari), tot ? Math.round(cur.vari/tot*100) + "%" : "—"));
    split.appendChild(sbox("f","固定", yen(cur.fix), tot ? Math.round(cur.fix/tot*100) + "%" : "—"));
    sp.appendChild(split);
    sp.appendChild(el("p","hint","家賃・光熱費・通信費・サブスク・投資・カードの引き落としを「固定」にしています。見るべきは左側だけです。"));
    box.appendChild(sp);

    box.appendChild(barChart(list, viewMonth));

    var cc = el("div","card");
    cc.appendChild(el("h2", null, "カテゴリ別（前の月との差）"));
    var arr = [];
    Object.keys(cur.cats).forEach(function(k){
      arr.push({k:k, v:cur.cats[k], p:(prev.cats[k] || 0)});
    });
    arr.sort(function(a,b){ return b.v - a.v; });
    if (!arr.length){
      cc.appendChild(el("p","empty","この月の支出がありません。"));
    } else {
      arr.forEach(function(r){
        var row = el("div","catrow");
        var nm = el("span", null, r.k + (FIXED[r.k] ? "（固定）" : ""));
        if (FIXED[r.k]) nm.style.color = "var(--fixed)";
        row.appendChild(nm);
        row.appendChild(el("span","amt", yen(r.v)));
        var d = r.v - r.p;
        row.appendChild(el("span","dif " + (d > 0 ? "up" : d < 0 ? "down" : ""), r.p ? signed(d) : "新規"));
        cc.appendChild(row);
      });
    }
    box.appendChild(cc);

    // 理想の割合と比べる
    var ic = el("div","card");
    ic.appendChild(el("h2", null, "理想の割合と比べる"));
    if (!cur.inc){
      ic.appendChild(el("p","empty","この月は収入の記録がないので、割合が出せません。"));
    } else {
      var names = Object.keys(IDEAL).filter(function(k){ return cur.cats[k] || IDEAL[k] >= 5; });
      names.sort(function(a,b){ return (cur.cats[b]||0) - (cur.cats[a]||0); });
      names.forEach(function(k){
        var v = cur.cats[k] || 0;
        var p = v / cur.inc * 100;
        var ideal = IDEAL[k];
        var over = p - ideal;
        var row = el("div","idealrow");
        row.appendChild(el("span","nm", k));
        var bar = el("div","ibar");
        var mark = el("i","mk");
        mark.style.left = Math.min(ideal, 100) + "%";
        var fill = el("i", over > 0 ? "fl over" : "fl");
        fill.style.width = Math.min(p, 100) + "%";
        bar.appendChild(fill); bar.appendChild(mark);
        row.appendChild(bar);
        row.appendChild(el("span","pc" + (over > 0 ? " over" : ""), Math.round(p) + "%"));
        row.appendChild(el("span","id", "目安" + ideal + "%"));
        ic.appendChild(row);
      });
      ic.appendChild(el("p","hint","縦の線が目安です。手取りに対する割合で見ています。目安を全部足すと78％で、残り22％が貯金にまわる形です。車がある人は「車関係」が重くなりがちです。"));
    }
    box.appendChild(ic);

    var sc = el("div","card");
    sc.appendChild(el("h2", null, "満足度でみる"));
    var st = cur.sat, known = st[1] + st[2] + st[3];
    if (!known){
      sc.appendChild(el("p","empty","この月には満足度の記録がありません。\n取り込んだ過去データには満足度が入っていないので、\nここは自分で入れた分だけが出ます。"));
    } else {
      var bar = el("div","satbar");
      [[3,"var(--sat-high)"],[2,"var(--sat-mid)"],[1,"var(--sat-low)"]].forEach(function(p){
        var i = el("i");
        i.style.width = (st[p[0]] / known * 100) + "%";
        i.style.background = p[1];
        bar.appendChild(i);
      });
      sc.appendChild(bar);
      var lg = el("div","satlegend");
      [[3,"よかった","var(--sat-high)"],[2,"ふつう","var(--sat-mid)"],[1,"いまいち","var(--sat-low)"]].forEach(function(p){
        var s = el("span");
        var q = el("i","sq"); q.style.background = p[2];
        s.appendChild(q);
        s.appendChild(el("span", null, p[1] + " " + yen(st[p[0]])));
        lg.appendChild(s);
      });
      sc.appendChild(lg);

      var lows = list.filter(function(e){
        return isOut(e) && e.sat === 1 && e.date.slice(0,7) === viewMonth;
      }).sort(function(a,b){ return b.amount - a.amount; }).slice(0,5);
      if (lows.length){
        sc.appendChild(el("h2", null, "金額が大きいのに「いまいち」だったもの"));
        lows.forEach(function(e){
          var row = el("div","catrow");
          row.appendChild(el("span", null, e.category + (e.memo ? "　" + e.memo : "")));
          row.appendChild(el("span","amt", yen(e.amount)));
          row.appendChild(el("span","dif", e.date.slice(5).split("-").join("/")));
          sc.appendChild(row);
        });
      }
      if (st.none){
        sc.appendChild(el("p","hint","満足度が入っていない支出が " + yen(st.none) + " 分あります（取り込んだ過去データ）。上の割合からは外してあります。"));
      }
    }
    box.appendChild(sc);
  }

  refreshHeader();
  renderList();
})();
</script>
</body>
</html>
